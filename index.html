<body>

<div class="calc-wrapper" id="generator-calculator" data-cta-url="#">

  <!-- Header -->
  <div class="calc-header">
    <div class="calc-header-icon">⚡</div>
    <h1>Generator Power Calculator</h1>
    <p>Answer a few quick questions and we'll recommend the right generator size for your home.</p>
  </div>

  <!-- Progress -->
  <div class="progress-bar">
    <div class="progress-fill" id="progress-fill"></div>
  </div>

  <!-- Step labels -->
  <div class="step-labels">
    <span data-step="0">Coverage</span>
    <span data-step="1">Heating</span>
    <span data-step="2">Appliances</span>
    <span data-step="3">Review</span>
    <span data-step="4">Results</span>
  </div>

  <!-- STEP 0 -->
  <section class="step" data-step="0">
    <h2>What level of backup power do you need?</h2>

    <button class="coverage-card" data-coverage="essential">Essential</button>
    <button class="coverage-card" data-coverage="whole">Whole House</button>
  </section>

  <!-- STEP 1 -->
  <section class="step" data-step="1">
    <h2>Heating type</h2>
    <button class="fuel-card" data-fuel="gas">Gas</button>
    <button class="fuel-card" data-fuel="electric">Electric</button>
  </section>

  <!-- STEP 2 -->
  <section class="step" data-step="2">
    <div id="appliance-panel"></div>
  </section>

  <!-- STEP 3 -->
  <section class="step" data-step="3">
    <div id="review-panel"></div>
  </section>

  <!-- STEP 4 -->
  <section class="step" data-step="4">
    <div id="results-panel"></div>
  </section>

  <!-- NAV -->
  <div class="nav">
    <button id="btn-back">Back</button>
    <button id="btn-next">Next</button>
  </div>

</div>

<script src="./calculator.js"></script>

</body>
